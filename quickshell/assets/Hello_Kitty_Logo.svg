<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hello Kitty face -->
  <ellipse cx="50" cy="55" rx="35" ry="30" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Left ear -->
  <polygon points="20,35 15,10 35,25" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Right ear -->
  <polygon points="80,35 85,10 65,25" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Left eye -->
  <ellipse cx="38" cy="52" rx="4" ry="5" fill="#333"/>
  <!-- Right eye -->
  <ellipse cx="62" cy="52" rx="4" ry="5" fill="#333"/>
  <!-- Nose -->
  <ellipse cx="50" cy="62" rx="4" ry="3" fill="#ffcc00"/>
  <!-- Whiskers left -->
  <line x1="15" y1="50" x2="30" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="15" y1="58" x2="30" y2="56" stroke="#333" stroke-width="1.5"/>
  <!-- Whiskers right -->
  <line x1="85" y1="50" x2="70" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="85" y1="58" x2="70" y2="56" stroke="#333" stroke-width="1.5"/>
  <!-- Red bow -->
  <g transform="translate(68,28)">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#ff0000"/>
    <ellipse cx="-12" cy="-3" rx="8" ry="6" fill="#ff0000"/>
    <ellipse cx="12" cy="-3" rx="8" ry="6" fill="#ff0000"/>
    <circle cx="0" cy="0" r="4" fill="#cc0000"/>
  </g>
</svg>
